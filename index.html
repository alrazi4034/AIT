<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alrazi School · Learning Programs</title>
<style>
:root{--bg:#fff4dc;--pn:#fff;--ln:#ffd28a;--tx:#2b2d42;--mu:#6b6f8a;--ac:#ff8a3d;--tl:#2ec4b6;--pu:#7b5cff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff4dc,#e6f7ff 60%,#f1e8ff);color:var(--tx);font:17px/1.7 Tahoma,"Segoe UI","Noto Sans Arabic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;box-shadow:0 3px 0 var(--ln)}header img{height:46px}header b{font-size:20px}
main{max-width:1000px;margin:auto;padding:24px 20px;width:100%;flex:1}
h1{font-size:40px;margin:6px 0;background:linear-gradient(90deg,var(--ac),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:block;text-align:left;font:inherit;color:inherit;text-decoration:none;background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:0 4px 0 var(--ln);cursor:pointer;transition:transform .12s}
.card:nth-child(4n+1){border-top:7px solid var(--ac)}.card:nth-child(4n+2){border-top:7px solid var(--tl)}.card:nth-child(4n+3){border-top:7px solid var(--pu)}.card:nth-child(4n){border-top:7px solid #ff5fa2}
.card:hover:not(.off){transform:translateY(-3px)}.card.off{opacity:.55;cursor:default}
.card .big{font-size:36px;font-weight:800;line-height:1.2}.card .ic{font-size:34px}.card .tg{display:inline-block;margin-top:6px;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--pu);color:#fff}.card.off .tg{background:var(--mu)}
.card h3{margin:4px 0;font-size:22px}.card p{margin:4px 0;color:var(--mu);font-size:15px}
button.back{font:inherit;background:#fff;border:2px solid var(--ln);border-radius:14px;padding:8px 16px;cursor:pointer;min-height:44px;box-shadow:0 3px 0 var(--ln);margin-bottom:14px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
footer{text-align:center;padding:16px 20px 24px;color:var(--mu);font-size:14px;border-top:1px solid var(--ln);line-height:1.7}
footer img{height:44px;vertical-align:middle;margin-inline-end:8px}footer a{color:var(--mu)}
</style></head><body>
