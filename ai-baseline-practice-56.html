<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Baseline Practice · Grades 5–6</title>
<style>
:root{--bg:#fff4dc;--pn:#ffffff;--ln:#ffd28a;--tx:#2b2d42;--mu:#6b6f8a;--ac:#ff8a3d;--tl:#2ec4b6;--er:#e63946;--pu:#7b5cff;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff4dc,#e6f7ff 60%,#f1e8ff);color:var(--tx);font:17px/1.7 Tahoma,"Segoe UI","Noto Sans Arabic",sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ln)}
header b{font-size:20px;direction:ltr;cursor:pointer}.sp{flex:1}
main{max-width:1100px;margin:auto;padding:20px}
button{font:inherit;background:var(--pn);color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:10px 18px;cursor:pointer;min-height:44px;box-shadow:0 3px 0 var(--ln);transition:transform .12s}
button:hover:not(:disabled){border-color:var(--tl);transform:translateY(-2px)}button:active:not(:disabled){transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}
button.p{background:var(--ac);color:#1b1405;border-color:var(--ac);font-weight:700}button.d{border-color:var(--er);color:var(--er)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;min-width:140px}.bar i{display:block;height:100%;background:var(--tl)}
.hero{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:center;margin:20px 0}
.hero h1{font-size:44px;margin:0;text-align:left}.row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px}.card.lock{opacity:.5}
.card h3{margin:0 0 4px}.st{color:var(--ac);letter-spacing:2px}
input[type=text]{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea,pre{direction:ltr;text-align:left;font:15px/1.6 Consolas,"Courier New",monospace;background:#2b2d42;color:#f4f1ff;border:1px solid var(--ln);border-radius:10px;padding:12px;margin:0;width:100%;white-space:pre-wrap;tab-size:4}
textarea{min-height:230px;resize:vertical}pre.o{min-height:120px}pre.e{border-color:var(--er)}
.k{color:#f28fad}.s{color:#9ad98b}.c{color:#6f8794}.n{color:#f2b84b}
.fb{padding:12px;border-radius:10px;margin:10px 0;background:var(--pn);border-inline-start:5px solid var(--mu)}.fb.ok{border-color:var(--tl)}.fb.no{border-color:var(--er)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--ln);padding:6px 10px;text-align:left}
.tag{background:var(--ac);color:#1b1405;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700}
.fl{display:flex;flex-direction:column;align-items:center;margin:10px 0}.nd{padding:8px 20px;border:2px solid var(--tl);background:var(--pn)}.nd.start,.nd.end{border-radius:30px;border-color:var(--ac)}.nd.io{border-style:double;border-width:4px}
.dec{width:220px;height:90px;background:var(--tl);color:#08201c;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 40px;font-size:14px}.br{font-size:14px;color:var(--ac);text-align:center}.ar{color:var(--mu)}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.dot{min-width:44px;padding:6px}.dot.dn{background:var(--tl);color:#08201c}.dot.now{border-color:var(--ac);border-width:3px}
.q{font-size:20px;font-weight:700}.opts,.ans,.pool{display:flex;flex-direction:column;gap:10px;margin:12px 0}.ans,.pool{flex-direction:row;flex-wrap:wrap;align-items:flex-start}.ans{min-height:60px;border:2px dashed var(--ln);border-radius:10px;padding:8px;flex-direction:column}
.opt,.ln,.tile{text-align:left;direction:ltr;white-space:pre;font-family:Consolas,monospace;font-size:16px}.opt.good,.ln.good{background:var(--tl);color:#08201c}
.g2{display:grid;gap:3px;margin:10px 0;direction:ltr}.cell{height:46px;background:#eafaf8;border:1px solid var(--ln);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}.cell small{font-size:11px;position:absolute;bottom:0;right:3px;color:var(--ac)}
.cf{position:fixed;top:55vh;font-size:26px;animation:up 1.5s ease-out forwards;pointer-events:none;z-index:9}@keyframes up{to{transform:translateY(-45vh) rotate(40deg);opacity:0}}@media(prefers-reduced-motion:reduce){.cf{display:none}}
pre.o:empty{display:none}details{margin:8px 0}
.opt .fl{margin:0;pointer-events:none}.opt:has(.fl){white-space:normal}
.hero h1{background:linear-gradient(90deg,var(--ac),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}header{background:#fff;box-shadow:0 3px 0 var(--ln)}
.card{box-shadow:0 4px 0 var(--ln);border-radius:18px}.grid .card:nth-child(4n+1){border-top:7px solid var(--ac)}.grid .card:nth-child(4n+2){border-top:7px solid var(--tl)}.grid .card:nth-child(4n+3){border-top:7px solid var(--pu)}.grid .card:nth-child(4n){border-top:7px solid #ff5fa2}
.q{color:var(--pu)}.tag{background:var(--pu)!important;color:#fff!important}.bar i{background:linear-gradient(90deg,var(--tl),var(--pu))}
.mis{background:#fff;border:2px dashed var(--pu);border-radius:16px;padding:4px 16px;margin:10px 0}.mis pre{margin-bottom:10px}
.lt{font-size:32px;font-weight:800;margin:6px 0}.sec{font-weight:800;color:var(--pu);align-self:center;margin-inline-end:4px}.card h3{font-size:21px;font-weight:800}
.note{color:var(--mu);font-size:15px}
@media(max-width:800px){.ed,.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}
@media print{header,button,.noprint{display:none!important}body{background:#fff;color:#000}}

/* ===== Platform additions ===== */
select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;min-width:260px;max-width:100%;min-height:44px}
input[type=password],input[type=text]{min-height:44px}
label{display:block;font-weight:700;margin:14px 0 4px}
header .tag{font-size:15px}header .note{font-size:15px}
.task{background:#fff;border:2px solid var(--ac);border-radius:16px;padding:6px 16px 12px;margin:12px 0}
.ctx{color:var(--mu);margin:4px 0}
table.spec{width:auto;min-width:55%;margin:6px 0;border-collapse:separate;border-spacing:4px}.spec th{background:none;border:none;font:700 15px Tahoma,"Segoe UI",sans-serif;padding:2px 6px;color:var(--mu)}.spec td{background:#fffaf0;border:1px solid var(--ln);border-radius:6px;font:15px Consolas,monospace;white-space:pre-line}
.opt.sel,.ln.sel{border-color:var(--pu);background:#efe9ff;box-shadow:0 3px 0 var(--pu)}
.opt,.ln{display:block;width:100%}
.dot:disabled{background:#eee}
.card.lock h3{color:var(--mu)}
.fb.ok{background:#e9fbf8}
.res th,.res td{text-align:center}.res td.nm{text-align:left}
.tw{overflow-x:auto;margin-bottom:10px}td.y{background:#e7f8f5;white-space:nowrap}tr.nr td{color:var(--mu)}
.res h3{margin:18px 0 6px}.stat{display:inline-block;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:4px 12px;margin:2px}
.cert{max-width:640px;margin:12px auto;background:#fffdf6;border:6px double var(--ac);border-radius:14px;padding:12px 22px;text-align:center;direction:ltr;box-shadow:0 4px 0 var(--ln);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert .brand{font-weight:800;letter-spacing:3px;color:var(--pu);font-size:14px}
.cert h1{margin:2px 0;font:700 26px Georgia,serif;color:var(--ac)}
.cert p{margin:2px 0;font-size:14px;line-height:1.4}
.cert .cname{font:700 26px Georgia,serif;border-bottom:2px solid var(--ln);display:inline-block;padding:0 20px;margin:4px 0;color:var(--tx)}
.cert .cmis{font-size:19px;font-weight:800;color:var(--pu);margin:2px 0}
.cert .cst{font-size:22px;color:var(--ac);letter-spacing:5px;line-height:1.3}
.cert .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.cert .foot>div{flex:1;min-width:120px}
.cert .qr{flex:0 0 130px!important}.cert .qr svg{width:130px;height:130px;display:block;margin:auto}.cert .qr small{display:block;font-size:11px;color:var(--mu);line-height:1.3}
.cert .ccode{font:700 18px Consolas,monospace;color:var(--tx);margin-top:4px;letter-spacing:2px}
@media print{@page{size:A4 landscape;margin:10mm}main{padding:0;max-width:none}.cert{box-shadow:none;margin:0 auto}.tw{overflow:visible}.res textarea,#codes{display:none}}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}.info>div{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:6px 18px 10px}.info h3{margin:10px 0 4px}.info ol{margin:4px 0;padding-inline-start:22px}.info .ab{direction:rtl;text-align:right}.info p,.info li{font-size:16px}
@media(max-width:800px){.info{grid-template-columns:1fr}}
.slogo{height:46px;width:auto;display:block}
header b{display:flex;align-items:center;gap:8px}
.hero .slogo{height:120px;margin-bottom:6px}
.cert .slogo{height:58px;margin:0 auto 2px}
.cert .schl{font-weight:700;color:var(--mu);font-size:13px;letter-spacing:1px}
.cert .by{font-size:11px;color:var(--mu);margin-top:4px}
footer{text-align:center;padding:16px 20px 24px;color:var(--mu);font-size:14px;border-top:1px solid var(--ln);margin-top:24px;line-height:1.7}
footer img{height:44px;width:auto;vertical-align:middle;margin-inline-end:8px}
footer a{color:var(--mu)}
@media print{footer{display:none}}

/* ===== AI Baseline Practice additions ===== */
.opt{white-space:normal;font-family:inherit;font-size:17px;text-align:left;direction:ltr;padding:12px 16px;line-height:1.5}
.opt.good,.ro.good{background:#dff7f3;border-color:var(--tl);color:#08201c}
.opt.bad,.ro.bad{background:#ffe9eb;border-color:var(--er)}
.opt:disabled{opacity:1;cursor:default}
.dot.dn{background:var(--tl);color:#08201c}
.rescard{display:flex;flex-wrap:wrap;align-items:center;gap:22px;background:#fff;border:3px solid var(--ln);border-radius:22px;padding:18px 24px;margin:14px 0;box-shadow:0 4px 0 var(--ln)}
.rescard.ok{border-color:var(--tl);--c:var(--tl)}.rescard.no{border-color:var(--er);--c:var(--er)}
.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e8e8f0 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:0 0 130px}
.ring::before{content:'';position:absolute;inset:13px;background:#fff;border-radius:50%}
.ring b,.ring span{position:relative;line-height:1.1}.ring b{font-size:42px}.ring span{font-size:13px;color:var(--mu)}
.verdict{font-size:30px;font-weight:800}.rescard.ok .verdict{color:#12877c}.rescard.no .verdict{color:var(--er)}
.big2{font-size:19px;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chip{padding:4px 12px;border-radius:10px;font-weight:700;font-size:15px;border:2px solid var(--ln);background:#fff}
.chip.y{background:#dff7f3;border-color:var(--tl);color:#0b5d54}.chip.n{background:#ffe9eb;border-color:var(--er);color:#a3202c}
.rt{margin:20px 0 8px}
.rv{background:#fff;border:2px dashed var(--pu);border-radius:16px;padding:6px 16px 12px;margin:10px 0}
.rv .q{font-size:18px}.ro{border:2px solid var(--ln);border-radius:10px;padding:8px 12px;margin:6px 0;direction:ltr;text-align:left;background:#fff}.ro em{font-style:normal;font-weight:700}
.cert .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.cert .cc{border:1px solid var(--ln);border-radius:8px;padding:4px 6px;font-size:12px;line-height:1.3;background:#fff}.cert .cc span{color:#12877c;font-weight:700}
.cert .qr{flex:0 0 150px!important}.cert .qr svg{width:150px;height:150px}
.cert .ccode{font:700 20px Consolas,monospace;letter-spacing:3px;word-break:break-all}
.res tr.av td{background:#f1e8ff}
@media(max-width:600px){.cert .cgrid{grid-template-columns:repeat(2,1fr)}}
@media print{.rescard,.rv{break-inside:avoid}}

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        if (c < 128) {

function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function expJSON(){dl('ai-baseline-results.json',JSON.stringify({v:1,res:TR}),'application/json')}
function impJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),R=d.res||{};let n=0;Object.keys(R).forEach(id=>{const x=R[id];if(x&&/^\d{6}$/.test(id)&&Array.isArray(x.att)&&x.att.length==STAGES&&x.att.every(a=>Number.isInteger(a)&&a>=1&&a<=9)){mergeRes(id,x.att,+x.t||0);n++}});saveTR();RM=`<p class="fb ok">Imported ${n} record(s). The newest report of each student was kept.</p>`}catch(e){RM='<p class="fb no">This file is not a valid results file.</p>'}results()};r.readAsText(f)}
function expCSV(){const q=v=>typeof v=='number'?v:`"${String(v).replace(/"/g,'""')}"`,rows=[['Class','Student','Finished all stages',...ST.map(s=>'Stage '+s.id+' attempts'),'Total attempts','Last report']];
 Object.keys(CL).forEach(c=>CL[c].forEach(n=>{const r=TR[sid6(c,n)];rows.push([c,n,r?'Yes':'No',...ST.map((s,i)=>r?r.att[i]:''),r?r.att.reduce((a,b)=>a+b,0):'',r&&r.t?new Date(r.t).toLocaleString('en-GB'):''])}));
 dl('ai-baseline-results.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}
function results(A){A=A||$('#app');const cs=Object.keys(CL),shown=cs.filter(c=>!RF||c==RF),dups=[...stuIndex().dup];
 cs.forEach(c=>{const seen={};CL[c].forEach(n=>{const k=norm(n);if(seen[k])dups.push(c+': '+n);seen[k]=1})});
 const tabs=shown.map(c=>{let rep=0,sum=0;const per=ST.map(()=>0);const rows=CL[c].map((n,j)=>{const r=TR[sid6(c,n)];let tot=0;if(r){rep++;r.att.forEach((a,i)=>{per[i]+=a;tot+=a});sum+=tot}
  return `<tr class="${r?'':'nr'}"><td>${j+1}</td><td class="nm" dir="auto">${esc(n)}</td>${ST.map((s,i)=>`<td class="${r?'y':''}">${r?(r.att[i]>=9?'9+':r.att[i]):'—'}</td>`).join('')}<td>${r?`<b>${tot}</b>`:'—'}</td></tr>`}).join('');
  const avg=rep?`<tr class="av"><td></td><td class="nm"><b>Average attempts</b></td>${per.map(p=>`<td>${(p/rep).toFixed(1)}</td>`).join('')}<td><b>${(sum/rep).toFixed(1)}</b></td></tr>`:'';
  return `<h3>Class ${esc(c)} <span class="stat">Finished and sent a report: ${rep} of ${CL[c].length}</span></h3><div class="tw"><table><tr><th>#</th><th>Student</th>${ST.map(s=>`<th>Stage ${s.id}</th>`).join('')}<th>Total</th></tr>${rows}${avg}</table></div>`}).join('');
 A.innerHTML=`<div class="res"><h2>📊 Student progress report</h2>
 <p class="fb noprint">Students send a report only after passing Stage ${STAGES}. Paste the WhatsApp messages you received (or only the 14-digit codes) and press Add. You can paste many messages at once. Each cell shows how many attempts the student needed to pass that stage (9+ = nine or more). Use Export to back up the results and Import to merge them on another device.</p>
 <textarea id="codes" rows="5" dir="auto" placeholder="Paste messages or codes here"></textarea>
 <div class="row noprint"><button class="p" onclick="addCodes()">➕ Add to report</button><button onclick="expJSON()">⬇️ Export results</button><button onclick="$('#imp').click()">⬆️ Import results</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="impJSON(this)"><button onclick="expCSV()">📄 Download CSV</button><button onclick="window.print()">🖨️ Print</button><button class="d" onclick="clearTR()">🗑️ Clear results</button></div>${RM}
 ${dups.length?`<p class="fb no">Warning: duplicate or clashing student names in students.js (<bdi dir="ltr">${esc(dups.join(' , '))}</bdi>). Change one of them so each student is unique.</p>`:''}
 <div class="row noprint"><label for="rf" style="margin:0">Show:</label><select id="rf" onchange="RF=this.value;RM='';results()"><option value="">All classes</option>${cs.map(c=>`<option ${c==RF?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <p class="note">Numbers = attempts needed to pass each stage. — = no report yet.</p>${tabs||'<p>No classes found in students.js</p>'}</div>`}
/* ===== Start ===== */
try{const u=JSON.parse(sessionStorage.getItem('aiq_userg56')||'null');if(u&&(u.role=='teacher'||(u.role=='student'&&CL[u.cls]&&CL[u.cls].includes(u.name))))setUser(u)}catch(e){}
go(USER?'map':'login');

</script></body></html>
